<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b19" />
    <title>Dev Stack | Build your toolkit</title>
    <style>
      #preloader.loader-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 22px;
        background: radial-gradient(circle at center, #ffffff 0%, #f5f4f0 45%, #ece9f2 100%);
        z-index: 1000;
        transition: opacity 0.35s ease, visibility 0.35s ease;
        animation: loaderFade 2.8s ease-in-out infinite alternate;
      }
      #preloader.loader-screen p {
        margin: 0;
        color: #000000;
        font: 700 13px Arial, sans-serif;
        letter-spacing: 2.5px;
        text-transform: uppercase;
      }
      #preloader .loader-orbit {
        position: relative;
        width: 180px;
        height: 180px;
        display: grid;
        place-items: center;
        animation: loaderPulse 2.2s ease-in-out infinite;
      }
      #preloader .loader-ring {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(143, 92, 255, 0.55);
        border-radius: 50%;
      }
      #preloader .ring-one { animation: spin 2.6s linear infinite; }
      #preloader .ring-two {
        border-color: rgba(245, 66, 140, 0.75);
        transform: scale(0.82);
        animation: spinReverse 2s linear infinite;
      }
      #preloader .loader-core {
        position: relative;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8f5cff, #f5428c, #55d9e7);
        box-shadow: 0 0 36px rgba(143, 92, 255, 0.55);
        animation: loaderCorePulse 1.1s ease-in-out infinite alternate;
      }
      body.app-ready #preloader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinReverse { to { transform: scale(0.82) rotate(-360deg); } }
      @keyframes loaderPulse {
        0%, 100% { transform: scale(0.92); }
        50% { transform: scale(1.08); }
      }
      @keyframes loaderCorePulse {
        from { transform: scale(0.82); }
        to { transform: scale(1.15); }
      }
      @keyframes loaderFade {
        from { opacity: 0.86; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="preloader" class="loader-screen" aria-live="polite" aria-busy="true">
      <div class="loader-orbit">
        <div class="loader-core"></div>
        <div class="loader-ring ring-one"></div>
        <div class="loader-ring ring-two"></div>
      </div>
      <p>Loading your toolkit...</p>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        const preloader = document.getElementById('preloader');
        const startedAt = performance.now();
        const minimumDuration = 2800;
        const hidePreloader = function () {
          document.body.classList.add('app-ready');
          setTimeout(function () {
            if (preloader) preloader.remove();
          }, 300);
        };

        window.addEventListener('load', function () {
          const remainingTime = Math.max(0, minimumDuration - (performance.now() - startedAt));
          setTimeout(hidePreloader, remainingTime);
        });

        setTimeout(hidePreloader, 6000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
